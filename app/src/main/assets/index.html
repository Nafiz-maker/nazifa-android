<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2783DE"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="response-actions.css"><link rel="stylesheet" href="responsive.css"><title>Nazifa AI</title></head><body><main class="app-shell"><header class="topbar"><div class="identity"><div class="avatar"><img src="icons/nazifa-icon.webp" alt="Nazifa"></div><div><h1>Nazifa</h1><p><span class="status-dot"></span>AI assistant</p></div></div><div class="top-actions"><button id="historyBtn" class="icon-btn" aria-label="Chat history">≡</button><button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button></div></header><section id="chat" class="chat" aria-live="polite"></section><section id="filePreview" class="file-preview" hidden></section><div id="attachMenu" class="pop-menu" hidden><button id="cameraBtn">📷 <span>Take a photo</span></button><button id="filesBtn">📎 <span>Add photos and files</span></button><button id="imageBtn">✨ <span>Create image <small>New</small></span></button><hr><button id="pageBtn">📄 <span>Create Notion page</span></button><button id="taskBtn">☑ <span>Add Notion task</span></button></div><form id="composer" class="composer"><input id="fileInput" type="file" accept="image/*,application/pdf,text/plain" multiple hidden><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><button type="button" id="attachBtn" class="icon-btn" aria-label="Add">＋</button><button type="button" id="micBtn" class="icon-btn" aria-label="Voice input">🎙</button><textarea id="prompt" rows="1" placeholder="Message Nazifa…"></textarea><button class="send" type="submit" aria-label="Send">↑</button></form></main><dialog id="historyDialog"><div class="modal"><div class="modal-head"><h2>Conversations</h2><button value="cancel" onclick="historyDialog.close()">✕</button></div><button id="newChatBtn" class="primary wide">＋ New chat</button><div id="conversationList" class="conversation-list"></div></div></dialog><dialog id="settingsDialog"><div class="modal"><div class="modal-head"><h2>Settings</h2><button onclick="settingsDialog.close()">✕</button></div><label>App server URL<input id="backendUrl" type="url"></label><label>Theme<select id="themeSelect"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label class="check"><input id="autoSpeak" type="checkbox"> Read responses aloud</label><p class="privacy-note">Your Notion token stays on the secure server.</p><button id="saveBtn" class="primary wide">Save settings</button></div></dialog><script src="app.js"></script><script src="response-actions.js"></script><script src="responsive.js"></script><script src="pollinations-image.js"></script></body></html>
