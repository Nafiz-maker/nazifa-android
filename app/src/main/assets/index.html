<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2783DE"><link rel="stylesheet" href="styles.css"><title>Nazifa AI</title></head><body><main class="app-shell"><header class="topbar"><div class="identity"><div class="avatar">🌸</div><div><h1>Nazifa</h1><p><span class="status-dot"></span> AI assistant</p></div></div><button id="settingsBtn" class="icon-btn" aria-label="Open settings">⚙</button></header><section id="chat" class="chat" aria-live="polite"><div class="message assistant"><div class="bubble"><strong>Hi Drop Nest!</strong><br>I’m Nazifa 🌸. Ask me anything, plan your day, or tap the microphone to speak.</div><time>Now</time></div><div class="suggestions"><button>Plan my day</button><button>Help me write</button><button>Brainstorm ideas</button></div></section><form id="composer" class="composer"><button type="button" id="micBtn" class="icon-btn mic">🎙</button><textarea id="prompt" rows="1" placeholder="Message Nazifa…"></textarea><button class="send" type="submit">↑</button></form></main><dialog id="settingsDialog"><form method="dialog" class="settings-card"><div class="settings-head"><div><h2>Settings</h2><p>Connect the app to your secure deployment.</p></div><button class="icon-btn" value="cancel">✕</button></div><label>App server URL<input id="backendUrl" type="url" placeholder="https://your-app.vercel.app"></label><p class="privacy-note">Your Notion token stays on the secure server and is never stored in the Android app.</p><div class="settings-actions"><button id="clearBtn" type="button" class="secondary">Clear chat</button><button id="saveBtn" type="button" class="primary">Save</button></div></form></dialog><script src="app.js"></script></body></html>
