<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030405">
  <meta name="description" content="Nazifa AI assistant">
  <link rel="stylesheet" href="styles.css">
  <title>Nazifa AI</title>
</head>
<body>
  <main class="app-shell">
    <div class="ambient" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar-left">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open navigation">
          <span class="hamburger" aria-hidden="true"></span>
        </button>
        <div class="brand" aria-label="Nazifa AI">
          <span class="brand-name">Nazifa</span>
          <span class="brand-type">AI</span>
          <span class="chevron" aria-hidden="true"></span>
        </div>
      </div>
      <div class="topbar-right">
        <button id="settingsBtn" class="icon-btn sparkle-btn" type="button" aria-label="Open settings">
          <span class="sparkle" aria-hidden="true"></span>
        </button>
        <div class="profile-avatar" aria-label="Profile">✿</div>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div id="welcomeState" class="welcome-state">
        <div class="assistant-mark" aria-hidden="true"></div>
        <h1>Ready when you are</h1>
        <p>Ask anything, create images, or organize your ideas with Nazifa.</p>
      </div>
      <div class="suggestions" aria-label="Suggested prompts">
        <button type="button">Plan my day</button>
        <button type="button">Help me write</button>
        <button type="button">Analyze an image</button>
      </div>
    </section>

    <section id="attachmentPreview" class="attachment-preview" hidden>
      <img id="previewImage" alt="Selected image preview">
      <span id="previewName"></span>
      <button id="removeImage" type="button" aria-label="Remove image">✕</button>
    </section>

    <form id="composer" class="composer">
      <input id="imageInput" type="file" accept="image/*" hidden>
      <button type="button" id="attachBtn" class="composer-btn add-btn" aria-label="Upload image">＋</button>
      <textarea id="prompt" rows="1" placeholder="Ask Nazifa" aria-label="Message Nazifa"></textarea>
      <button type="button" id="micBtn" class="composer-btn mic-btn" aria-label="Use microphone">
        <span class="mic-icon" aria-hidden="true"></span>
      </button>
      <button class="send voice-btn" type="submit" aria-label="Start voice mode">
        <span class="voice-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </form>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings-card">
      <div class="settings-head">
        <div>
          <h2>Settings</h2>
          <p>Connect the app to your secure deployment.</p>
        </div>
        <button class="icon-btn close-btn" value="cancel" aria-label="Close settings">✕</button>
      </div>
      <label>App server URL<input id="backendUrl" type="url"></label>
      <p class="privacy-note">Your Notion token stays on the secure server.</p>
      <div class="settings-actions">
        <button id="clearBtn" type="button" class="secondary">Clear chat</button>
        <button id="saveBtn" type="button" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
