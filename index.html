<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2783DE"><link rel="stylesheet" href="styles.css"><title>Nazifa AI</title></head><body><main class="app-shell"><header class="topbar"><div class="identity"><div class="avatar">🌸</div><div><h1>Nazifa</h1><p><span class="status-dot"></span> AI assistant</p></div></div><button id="settingsBtn" class="icon-btn" aria-label="Open settings">⚙</button></header><section id="chat" class="chat" aria-live="polite"><div class="message assistant"><div class="bubble"><strong>Hi Drop Nest!</strong><br>I’m Nazifa 🌸. Ask me anything or upload an image for me to analyze.</div><time>Now</time></div><div class="suggestions"><button>Plan my day</button><button>Help me write</button><button>Analyze an image</button></div></section><section id="attachmentPreview" class="attachment-preview" hidden><img id="previewImage" alt="Selected image preview"><span id="previewName"></span><button id="removeImage" type="button" aria-label="Remove image">✕</button></section><form id="composer" class="composer"><input id="imageInput" type="file" accept="image/*" hidden><button type="button" id="attachBtn" class="icon-btn" aria-label="Upload image">＋</button><textarea id="prompt" rows="1" placeholder="Message Nazifa…"></textarea><button class="send" type="submit" aria-label="Send">↑</button></form></main><dialog id="settingsDialog"><form method="dialog" class="settings-card"><div class="settings-head"><div><h2>Settings</h2><p>Connect the app to your secure deployment.</p></div><button class="icon-btn" value="cancel">✕</button></div><label>App server URL<input id="backendUrl" type="url"></label><p class="privacy-note">Your Notion token stays on the secure server.</p><div class="settings-actions"><button id="clearBtn" type="button" class="secondary">Clear chat</button><button id="saveBtn" type="button" class="primary">Save</button></div></form></dialog><script src="app.js"></script></body></html>
